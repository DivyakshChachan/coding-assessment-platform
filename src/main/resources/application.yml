spring:
  application:
    name: coding-assessment-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/coding_assessment
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
server:
  port: 8080