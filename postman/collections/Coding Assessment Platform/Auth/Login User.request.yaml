$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{registeredEmail}}",
      "password": "Password123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-LOGIN-01: Status code is 200
      pm.test("TC-LOGIN-01: Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      // TC-LOGIN-02: Response has success: true
      pm.test("TC-LOGIN-02: Response body has success: true", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });

      // TC-LOGIN-03: Access token is present and non-empty
      pm.test("TC-LOGIN-03: Access token is present and non-empty", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property("accessToken");
          pm.expect(json.data.accessToken).to.be.a("string").and.not.empty;
      });

      // TC-LOGIN-04: Refresh token is present and non-empty
      pm.test("TC-LOGIN-04: Refresh token is present and non-empty", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property("refreshToken");
          pm.expect(json.data.refreshToken).to.be.a("string").and.not.empty;
      });

      // TC-LOGIN-05: Access token is a valid JWT (3 parts separated by dots)
      pm.test("TC-LOGIN-05: Access token is a valid JWT format", function () {
          const json = pm.response.json();
          const parts = json.data.accessToken.split(".");
          pm.expect(parts.length).to.equal(3);
      });

      // TC-LOGIN-06: User object is returned with correct fields
      pm.test("TC-LOGIN-06: User object contains id, username, email, fullName, role", function () {
          const json = pm.response.json();
          pm.expect(json.data.user).to.have.property("id");
          pm.expect(json.data.user).to.have.property("username");
          pm.expect(json.data.user).to.have.property("email");
          pm.expect(json.data.user).to.have.property("fullName");
          pm.expect(json.data.user).to.have.property("role");
      });

      // TC-LOGIN-07: Password is not returned in response
      pm.test("TC-LOGIN-07: Password is NOT exposed in the response", function () {
          const json = pm.response.json();
          pm.expect(json.data.user).to.not.have.property("password");
      });

      // TC-LOGIN-08: Response time is acceptable
      pm.test("TC-LOGIN-08: Response time is less than 3000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });

      // Save tokens for subsequent requests
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.environment.set("accessToken", json.data.accessToken);
          pm.environment.set("refreshToken", json.data.refreshToken);
      }
