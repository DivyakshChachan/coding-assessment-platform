$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/register'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "ab",
      "email": "not-an-email",
      "password": "short",
      "fullName": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-REG-VAL-01: Should return 400 Bad Request for invalid input
      pm.test("TC-REG-VAL-01: Returns 400 Bad Request for invalid input", function () {
          pm.response.to.have.status(400);
      });

      // TC-REG-VAL-02: Response has success: false
      pm.test("TC-REG-VAL-02: Response body has success: false", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
      });

      // TC-REG-VAL-03: Validation errors are present
      pm.test("TC-REG-VAL-03: Validation error details are present", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
      });
