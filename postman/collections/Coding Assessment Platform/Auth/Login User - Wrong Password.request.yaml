$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{registeredEmail}}",
      "password": "WrongPassword999!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-LOGIN-FAIL-01: Should return 401 Unauthorized for wrong password
      pm.test("TC-LOGIN-FAIL-01: Returns 401 Unauthorized for wrong password", function () {
          pm.response.to.have.status(401);
      });

      // TC-LOGIN-FAIL-02: Response has success: false
      pm.test("TC-LOGIN-FAIL-02: Response body has success: false", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
      });

      // TC-LOGIN-FAIL-03: No tokens are returned
      pm.test("TC-LOGIN-FAIL-03: No access token is returned on failed login", function () {
          const json = pm.response.json();
          if (json.data) {
              pm.expect(json.data).to.not.have.property("accessToken");
          } else {
              pm.expect(json).to.not.have.property("accessToken");
          }
      });
