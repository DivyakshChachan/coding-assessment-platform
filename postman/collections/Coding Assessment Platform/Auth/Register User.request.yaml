$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "{{dynamicUsername}}",
      "email": "{{dynamicEmail}}",
      "password": "Password123!",
      "fullName": "Test User"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const suffix = Math.floor(Math.random() * 100000);
      pm.collectionVariables.set("dynamicUsername", "testuser" + suffix);
      pm.collectionVariables.set("dynamicEmail", "testuser" + suffix + "@example.com");
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-REG-01: Status code is 201
      pm.test("TC-REG-01: Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });

      // TC-REG-02: Response has success: true
      pm.test("TC-REG-02: Response body has success: true", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });

      // TC-REG-03: Response contains user data
      pm.test("TC-REG-03: Response contains user data with id, username, email, fullName, role", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property("id");
          pm.expect(json.data).to.have.property("username");
          pm.expect(json.data).to.have.property("email");
          pm.expect(json.data).to.have.property("fullName");
          pm.expect(json.data).to.have.property("role");
      });

      // TC-REG-04: Role is one of the valid enum values
      pm.test("TC-REG-04: Role is a valid enum value (ADMIN, PROBLEM_SETTER, CANDIDATE)", function () {
          const json = pm.response.json();
          pm.expect(["ADMIN", "PROBLEM_SETTER", "CANDIDATE"]).to.include(json.data.role);
      });

      // TC-REG-05: Password is not returned in response
      pm.test("TC-REG-05: Password is NOT exposed in the response", function () {
          const json = pm.response.json();
          pm.expect(json.data).to.not.have.property("password");
      });

      // TC-REG-06: Content-Type is application/json
      pm.test("TC-REG-06: Content-Type is application/json", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      // TC-REG-07: Response time is acceptable
      pm.test("TC-REG-07: Response time is less than 3000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });

      // Save credentials for subsequent requests
      if (pm.response.code === 201) {
          const json = pm.response.json();
          pm.environment.set("registeredEmail", json.data.email);
          pm.environment.set("registeredUsername", json.data.username);
          pm.collectionVariables.set("registeredUserId", json.data.id);
      }
