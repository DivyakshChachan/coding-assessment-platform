$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/login'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "nonexistent@example.com",
      "password": "Password123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-LOGIN-NE-01: Should return 401 or 404 for non-existent user
      pm.test("TC-LOGIN-NE-01: Returns 401 or 404 for non-existent email", function () {
          pm.expect([401, 404]).to.include(pm.response.code);
      });

      // TC-LOGIN-NE-02: Response has success: false
      pm.test("TC-LOGIN-NE-02: Response body has success: false", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
      });
