$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/auth/register'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "anotheruser",
      "email": "{{registeredEmail}}",
      "password": "Password123!",
      "fullName": "Another User"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-REG-DUP-01: Should return 409 Conflict for duplicate email
      pm.test("TC-REG-DUP-01: Returns 409 Conflict for duplicate email", function () {
          pm.response.to.have.status(409);
      });

      // TC-REG-DUP-02: Response has success: false
      pm.test("TC-REG-DUP-02: Response body has success: false", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
      });

      // TC-REG-DUP-03: Error message is present
      pm.test("TC-REG-DUP-03: Error message is present in response", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          pm.expect(json.message).to.be.a("string").and.not.empty;
      });
