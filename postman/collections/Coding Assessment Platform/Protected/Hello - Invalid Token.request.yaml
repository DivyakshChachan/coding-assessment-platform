$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/test/hello'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: 'invalid.jwt.token'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-HELLO-INVALID-01: Should return 401 Unauthorized with invalid token
      pm.test("TC-HELLO-INVALID-01: Returns 401 Unauthorized with invalid JWT token", function () {
          pm.response.to.have.status(401);
      });

      // TC-HELLO-INVALID-02: Response has appropriate error
      pm.test("TC-HELLO-INVALID-02: Response contains error information", function () {
          pm.expect(pm.response.code).to.equal(401);
      });
