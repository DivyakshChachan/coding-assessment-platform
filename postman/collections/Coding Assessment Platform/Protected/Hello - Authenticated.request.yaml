$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/test/hello'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-HELLO-01: Status code is 200
      pm.test("TC-HELLO-01: Status code is 200 OK with valid JWT", function () {
          pm.response.to.have.status(200);
      });

      // TC-HELLO-02: Response body confirms JWT is working
      pm.test("TC-HELLO-02: Response body confirms JWT authentication is working", function () {
          pm.expect(pm.response.text()).to.include("JWT Authentication Working");
      });

      // TC-HELLO-03: Response time is acceptable
      pm.test("TC-HELLO-03: Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
