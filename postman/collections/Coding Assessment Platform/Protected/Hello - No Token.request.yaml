$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/test/hello'
order: 2000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-HELLO-NOAUTH-01: Should return 401 Unauthorized without token
      pm.test("TC-HELLO-NOAUTH-01: Returns 401 Unauthorized without JWT token", function () {
          pm.response.to.have.status(401);
      });

      // TC-HELLO-NOAUTH-02: Response does not contain sensitive data
      pm.test("TC-HELLO-NOAUTH-02: Response does not leak sensitive data", function () {
          const body = pm.response.text();
          pm.expect(body).to.not.include("password");
          pm.expect(body).to.not.include("secret");
      });
